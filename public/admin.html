<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UptimePulse - Admin Console</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="container" id="main-app" style="display: none;">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div>
          <h1>UptimePulse Admin</h1>
          <div class="subtitle">System Monitoring &amp; Probe Controls</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="/" class="btn btn-sm">View Public Status</a>
        <button class="btn btn-sm" id="btn-logout" onclick="handleLogout()">Logout</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="btn-text">Add Monitor</span>
        </button>
      </div>
    </header>

    <!-- Overview Banner -->
    <div class="banner">
      <div class="banner-status">
        <div class="status-dot" id="system-dot"></div>
        <div class="banner-text" id="system-status">Checking systems...</div>
      </div>
      <div class="banner-stats">
        <div class="stat-item">
          <div class="stat-val" id="count-up">0</div>
          <div class="stat-lbl">Operational</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="count-down">0</div>
          <div class="stat-lbl">Incidents</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="count-total">0</div>
          <div class="stat-lbl">Monitors</div>
        </div>
      </div>
    </div>

    <!-- Monitor List -->
    <div class="monitor-list" id="monitor-container">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>Belum ada monitor. Klik "Add Monitor" untuk menambahkan.</p>
      </div>
    </div>
  </div>

  <!-- Login Modal Overlay -->
  <div class="modal-overlay" id="login-modal" style="display: flex;">
    <div class="modal" style="max-width: 380px;">
      <div style="text-align: center; margin-bottom: 22px;">
        <div class="logo-badge" style="margin: 0 auto 14px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 600;">Admin Console Login</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Enter credentials to manage monitors</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="login-user" value="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="login-pass" placeholder="Password" required autocomplete="current-password">
        </div>
        <div id="login-err-msg" style="color: var(--red); font-size: 12px; margin-bottom: 12px; display: none;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <a href="/" class="btn" style="flex: 1; justify-content: center;">Back</a>
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;" id="btn-login-submit">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Monitor Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">New Monitor</div>
        <button class="btn-icon" onclick="closeAddModal()">&times;</button>
      </div>
      <form id="monitor-form" onsubmit="handleCreateMonitor(event)">
        <div class="form-group">
          <label>Friendly Name</label>
          <input type="text" class="form-control" id="m-name" placeholder="e.g. Cloudflare DNS or My App" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Monitor Type</label>
            <select class="form-control" id="m-type" onchange="handleTypeChange()">
              <option value="http">HTTP(s)</option>
              <option value="tcp">TCP Port</option>
              <option value="ping">Ping (ICMP)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Check Interval (sec)</label>
            <input type="number" class="form-control" id="m-interval" value="60" min="5" max="86400" required>
          </div>
        </div>
        <div class="form-group">
          <label id="target-label">Target URL</label>
          <input type="text" class="form-control" id="m-target" placeholder="https://example.com" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Monitor</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
