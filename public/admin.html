<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UptimePulse - Admin Console</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #238636;
      --green-glow: rgba(35, 134, 54, 0.4);
      --red: #da3633;
      --red-glow: rgba(218, 54, 51, 0.4);
      --amber: #d29922;
      --blue: #58a6ff;
      --accent: #2ea043;
      --input-bg: #0d1117;
      --input-border: #30363d;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 50% 0%, rgba(56, 139, 253, 0.05) 0%, transparent 50%);
    }

    /* Container */
    .container {
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #238636, #2ea043);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--green-glow);
    }

    .logo-badge svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #21262d;
      color: var(--text);
      text-decoration: none;
    }

    .btn:hover {
      background: #30363d;
    }

    .btn-primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }

    .btn-primary:hover {
      background: #2ea043;
      box-shadow: 0 0 16px var(--green-glow);
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Overview Banner */
    .banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .banner-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse 2s infinite ease-in-out;
    }

    .status-dot.down {
      background: var(--red);
      box-shadow: 0 0 8px var(--red-glow);
    }

    .status-dot.paused {
      background: var(--text-muted);
      box-shadow: none;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .banner-text {
      font-size: 15px;
      font-weight: 500;
    }

    .banner-stats {
      display: flex;
      gap: 24px;
    }

    .stat-item {
      text-align: right;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Monitor List */
    .monitor-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .monitor-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1.8fr 1fr 1.6fr auto;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .monitor-card:hover {
      border-color: var(--card-hover);
      background: rgba(30, 37, 46, 0.8);
    }

    .monitor-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .monitor-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .type-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--blue);
      text-transform: uppercase;
    }

    .monitor-target {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .metric-group {
      display: flex;
      gap: 20px;
    }

    .metric {
      font-size: 13px;
    }

    .metric-value {
      font-weight: 600;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Latency Bars / Sparkline */
    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 32px;
      justify-content: flex-end;
    }

    .bar {
      width: 4px;
      border-radius: 2px;
      background: #238636;
      transition: height 0.3s ease, background-color 0.2s;
    }

    .bar.down {
      background: #da3633;
    }

    .bar-empty {
      background: rgba(255, 255, 255, 0.05);
      height: 6px;
    }

    /* Card Actions */
    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
      background: #161b22;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      color: var(--text);
      background: #30363d;
      border-color: #8b949e;
    }

    .btn-icon.danger:hover {
      color: #f85149;
      border-color: #da3633;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--blue);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: #30363d;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .monitor-card {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .bars-container {
        justify-content: flex-start;
      }
      .header-actions .btn-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="main-app" style="display: none;">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div>
          <h1>UptimePulse Admin</h1>
          <div class="subtitle">System Monitoring &amp; Probe Controls</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="/" class="btn btn-sm">View Public Status</a>
        <button class="btn btn-sm" id="btn-logout" onclick="handleLogout()">Logout</button>
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="btn-text">Add Monitor</span>
        </button>
      </div>
    </header>

    <!-- Overview Banner -->
    <div class="banner">
      <div class="banner-status">
        <div class="status-dot" id="system-dot"></div>
        <div class="banner-text" id="system-status">Checking systems...</div>
      </div>
      <div class="banner-stats">
        <div class="stat-item">
          <div class="stat-val" id="count-up">0</div>
          <div class="stat-lbl">Operational</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="count-down">0</div>
          <div class="stat-lbl">Incidents</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="count-total">0</div>
          <div class="stat-lbl">Monitors</div>
        </div>
      </div>
    </div>

    <!-- Monitor List -->
    <div class="monitor-list" id="monitor-container">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>No monitors added yet. Click "Add Monitor" to begin.</p>
      </div>
    </div>
  </div>

  <!-- Login Modal Overlay -->
  <div class="modal-overlay" id="login-modal" style="display: flex;">
    <div class="modal" style="max-width: 380px;">
      <div style="text-align: center; margin-bottom: 22px;">
        <div class="logo-badge" style="margin: 0 auto 14px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 600;">Admin Console Login</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Enter credentials to manage monitors</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="login-user" value="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="login-pass" placeholder="Password" required autocomplete="current-password">
        </div>
        <div id="login-err-msg" style="color: var(--red); font-size: 12px; margin-bottom: 12px; display: none;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <a href="/" class="btn" style="flex: 1; justify-content: center;">Back</a>
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;" id="btn-login-submit">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Monitor Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">New Monitor</div>
        <button class="btn-icon" onclick="closeAddModal()">&times;</button>
      </div>
      <form id="monitor-form" onsubmit="handleCreateMonitor(event)">
        <div class="form-group">
          <label>Friendly Name</label>
          <input type="text" class="form-control" id="m-name" placeholder="e.g. Cloudflare DNS or My App" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Monitor Type</label>
            <select class="form-control" id="m-type" onchange="handleTypeChange()">
              <option value="http">HTTP(s)</option>
              <option value="tcp">TCP Port</option>
              <option value="ping">Ping (ICMP)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Check Interval (sec)</label>
            <input type="number" class="form-control" id="m-interval" value="60" min="5" max="86400" required>
          </div>
        </div>
        <div class="form-group">
          <label id="target-label">Target URL</label>
          <input type="text" class="form-control" id="m-target" placeholder="https://example.com" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Monitor</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let monitorsMap = new Map();

    // Wrapper fetch yang otomatis menyertakan session cookie & Bearer token
    async function apiFetch(url, options = {}) {
      options.credentials = 'same-origin';
      options.headers = options.headers || {};
      const token = localStorage.getItem('uptime_token');
      if (token) {
        options.headers['Authorization'] = `Bearer ${token}`;
      }
      const res = await fetch(url, options);
      if (res.status === 401) {
        showLogin();
        throw new Error('Unauthorized');
      }
      return res;
    }

    async function checkAuth() {
      try {
        const res = await apiFetch('/api/auth/me');
        const data = await res.json();
        if (data.authenticated) {
          showDashboard();
          await loadMonitors();
          initSSE();
        } else {
          showLogin();
        }
      } catch (e) {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('login-modal').style.display = 'flex';
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('login-pass').focus();
    }

    function showDashboard() {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;
      const errBox = document.getElementById('login-err-msg');
      const submitBtn = document.getElementById('btn-login-submit');

      errBox.style.display = 'none';
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('uptime_token', data.token);
          showDashboard();
          await loadMonitors();
          initSSE();
        } else {
          errBox.textContent = data.error || 'Login gagal';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Gagal menghubungi server: ' + err;
        errBox.style.display = 'block';
      } finally {
        submitBtn.textContent = 'Sign In';
        submitBtn.disabled = false;
      }
    }

    async function handleLogout() {
      try {
        await apiFetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      localStorage.removeItem('uptime_token');
      window.location.reload();
    }

    async function loadMonitors() {
      try {
        const res = await apiFetch('/api/monitors');
        const list = await res.json();
        const container = document.getElementById('monitor-container');
        
        if (!list || list.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <p>No monitors added yet. Click "Add Monitor" to begin.</p>
            </div>
          `;
          updateBanner(0, 0, 0);
          return;
        }

        container.innerHTML = '';
        for (const m of list) {
          monitorsMap.set(m.id, m);
          container.appendChild(createMonitorCard(m));
          loadDetails(m.id);
        }
        recalcStats();
      } catch (err) {
        console.error('Failed to load monitors:', err);
      }
    }

    async function loadDetails(id) {
      try {
        const res = await apiFetch(`/api/monitors/${id}`);
        if (!res.ok) return;
        const data = await res.json();
        updateCardMetrics(data);
      } catch (e) {
        console.error('Failed to load detail for', id, e);
      }
    }

    function createMonitorCard(m) {
      const card = document.createElement('div');
      card.className = 'monitor-card';
      card.id = `card-${m.id}`;

      const statusClass = m.status === 'up' ? 'up' : (m.status === 'down' ? 'down' : 'paused');
      const latencyText = m.last_latency_ms ? `${m.last_latency_ms.toFixed(1)} ms` : '--';

      card.innerHTML = `
        <div class="monitor-info">
          <div class="status-dot ${statusClass}" id="dot-${m.id}"></div>
          <div>
            <div class="monitor-title">
              ${escapeHtml(m.name)}
              <span class="type-badge">${m.monitor_type}</span>
            </div>
            <div class="monitor-target" title="${escapeHtml(m.target)}">${escapeHtml(m.target)}</div>
          </div>
        </div>
        <div class="metric-group">
          <div class="metric">
            <div class="metric-value" id="lat-${m.id}">${latencyText}</div>
            <div class="metric-label">Latency</div>
          </div>
          <div class="metric">
            <div class="metric-value" id="upt-${m.id}">--%</div>
            <div class="metric-label">24h Uptime</div>
          </div>
        </div>
        <div class="bars-container" id="bars-${m.id}">
        </div>
        <div class="card-actions">
          <button class="btn-icon" title="Check Now" onclick="checkNow(${m.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
          <button class="btn-icon" title="Pause / Resume" onclick="togglePause(${m.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="10" y1="15" x2="10" y2="9"></line>
              <line x1="14" y1="15" x2="14" y2="9"></line>
            </svg>
          </button>
          <button class="btn-icon danger" title="Delete" onclick="deleteMonitor(${m.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      `;
      return card;
    }

    function updateCardMetrics(data) {
      const m = data.monitor;
      monitorsMap.set(m.id, m);

      const dot = document.getElementById(`dot-${m.id}`);
      if (dot) {
        dot.className = `status-dot ${m.status === 'up' ? 'up' : (m.status === 'down' ? 'down' : 'paused')}`;
      }

      const latEl = document.getElementById(`lat-${m.id}`);
      if (latEl && m.last_latency_ms) {
        latEl.textContent = `${m.last_latency_ms.toFixed(1)} ms`;
      }

      const uptEl = document.getElementById(`upt-${m.id}`);
      if (uptEl) {
        uptEl.textContent = `${data.uptime_24h.toFixed(1)}%`;
      }

      const barsContainer = document.getElementById(`bars-${m.id}`);
      if (barsContainer && data.recent_heartbeats) {
        barsContainer.innerHTML = '';
        const hbs = data.recent_heartbeats;
        const padCount = Math.max(0, 25 - hbs.length);
        for (let i = 0; i < padCount; i++) {
          const emptyBar = document.createElement('div');
          emptyBar.className = 'bar bar-empty';
          barsContainer.appendChild(emptyBar);
        }
        for (const hb of hbs) {
          const bar = document.createElement('div');
          bar.className = `bar ${hb.is_up ? '' : 'down'}`;
          const height = hb.is_up ? Math.min(28, Math.max(8, Math.round(hb.latency_ms / 15))) : 28;
          bar.style.height = `${height}px`;
          bar.title = `${hb.checked_at} - ${hb.is_up ? hb.latency_ms + 'ms' : (hb.error_message || 'Down')}`;
          barsContainer.appendChild(bar);
        }
      }
      recalcStats();
    }

    function recalcStats() {
      let up = 0;
      let down = 0;
      let total = monitorsMap.size;

      monitorsMap.forEach(m => {
        if (m.status === 'up') up++;
        else if (m.status === 'down') down++;
      });

      updateBanner(up, down, total);
    }

    function updateBanner(up, down, total) {
      document.getElementById('count-up').textContent = up;
      document.getElementById('count-down').textContent = down;
      document.getElementById('count-total').textContent = total;

      const dot = document.getElementById('system-dot');
      const text = document.getElementById('system-status');

      if (total === 0) {
        dot.className = 'status-dot paused';
        text.textContent = 'No monitors configured';
      } else if (down > 0) {
        dot.className = 'status-dot down';
        text.textContent = `${down} Service Incident${down > 1 ? 's' : ''} Detected`;
      } else {
        dot.className = 'status-dot up';
        text.textContent = 'All Systems Operational';
      }
    }

    function initSSE() {
      const evtSource = new EventSource('/api/events');
      evtSource.onmessage = (e) => {
        try {
          const event = JSON.parse(e.data);
          const m = monitorsMap.get(event.monitor_id);
          if (m) {
            m.status = event.status;
            m.last_latency_ms = event.latency_ms;
            loadDetails(m.id);
          }
        } catch (err) {
          console.error('SSE parse error:', err);
        }
      };
      evtSource.onerror = () => {
        setTimeout(initSSE, 5000);
      };
    }

    async function checkNow(id) {
      try {
        await apiFetch(`/api/monitors/${id}/check`, { method: 'POST' });
        loadDetails(id);
      } catch (err) {
        alert('Check failed: ' + err);
      }
    }

    async function togglePause(id) {
      try {
        await apiFetch(`/api/monitors/${id}/pause`, { method: 'POST' });
        loadDetails(id);
      } catch (err) {
        alert('Action failed: ' + err);
      }
    }

    async function deleteMonitor(id) {
      if (!confirm('Are you sure you want to remove this monitor?')) return;
      try {
        await apiFetch(`/api/monitors/${id}`, { method: 'DELETE' });
        monitorsMap.delete(id);
        const card = document.getElementById(`card-${id}`);
        if (card) card.remove();
        recalcStats();
      } catch (err) {
        alert('Delete failed: ' + err);
      }
    }

    function openAddModal() {
      document.getElementById('add-modal').style.display = 'flex';
      document.getElementById('m-name').focus();
    }

    function closeAddModal() {
      document.getElementById('add-modal').style.display = 'none';
      document.getElementById('monitor-form').reset();
    }

    function handleTypeChange() {
      const type = document.getElementById('m-type').value;
      const targetInput = document.getElementById('m-target');
      const targetLabel = document.getElementById('target-label');
      if (type === 'tcp') {
        targetLabel.textContent = 'Target Host & Port';
        targetInput.placeholder = '192.168.1.1:80 or example.com:22';
      } else if (type === 'ping') {
        targetLabel.textContent = 'Target Host / IP';
        targetInput.placeholder = '1.1.1.1 or example.com';
      } else {
        targetLabel.textContent = 'Target URL';
        targetInput.placeholder = 'https://example.com';
      }
    }

    async function handleCreateMonitor(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('m-name').value,
        monitor_type: document.getElementById('m-type').value,
        target: document.getElementById('m-target').value,
        interval_sec: parseInt(document.getElementById('m-interval').value) || 60,
        timeout_sec: 10,
      };

      try {
        const res = await apiFetch('/api/monitors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          closeAddModal();
          await loadMonitors();
        } else {
          const err = await res.text();
          alert('Failed to add monitor: ' + err);
        }
      } catch (err) {
        alert('Error: ' + err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });
  </script>
</body>
</html>
